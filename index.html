<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Reading Arcade">
  <meta name="theme-color" content="#140d1f">
  <title>Reading Arcade</title>
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/games.css">
  <link rel="stylesheet" href="css/arcade.css">
</head>
<body>
  <main class="page arcade">
    <div class="top-right"></div>
    <h1 class="neon">Reading Arcade</h1>
    <div class="cabinets">
      <a class="cabinet dragon" href="dragon.html">
        <div class="marquee">dragons</div>
        <div class="screen"><canvas id="art-dragon" class="pixel" width="64" height="64"></canvas></div>
        <div class="progress" id="prog-dragon"></div>
      </a>
      <a class="cabinet spooky" href="halloween.html">
        <div class="marquee">pumpkins</div>
        <div class="screen"><canvas id="art-spooky" class="pixel" width="32" height="32"></canvas></div>
        <div class="progress" id="prog-spooky"></div>
      </a>
      <a class="cabinet math" href="math.html">
        <div class="marquee">Spidey</div>
        <div class="screen"><canvas id="art-math" class="pixel" width="32" height="32"></canvas></div>
        <div class="progress" id="prog-math"></div>
      </a>
      <a class="cabinet kirby" href="kirby.html">
        <div class="marquee">Kirby</div>
        <div class="screen"><canvas id="art-kirby" class="pixel" width="32" height="32"></canvas></div>
        <div class="progress" id="prog-kirby"></div>
      </a>
    </div>
  </main>
  <script type="module" src="js/arcade.js"></script>
</body>
</html>
